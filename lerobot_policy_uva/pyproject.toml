[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_uva"
version = "0.3.0"
description = "LeRobot adapter for the original Unified Video Action policy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "UVA contributors" },
]
dependencies = [
  "lerobot[training,evaluation,hardware]>=0.6.1,<0.7",
  "torch>=2.2",
  "torchvision",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "einops>=0.6",
  "numpy>=2,<2.3",
  "scipy",
  "timm>=0.9",
  "tqdm",
  "transformers>=4.48,<6",
  "zarr<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_policy_uva*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
