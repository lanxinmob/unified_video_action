name: robocasa
task_type: single_dataset
task_modes: ["policy_model", "full_dynamic_model"]

shape_meta: &shape_meta
  image_resolution: 224
  action:
    shape:
    - 12
  obs:
    ee_pos:
      shape:
      - 3
    ee_ori:
      shape:
      - 3
    gripper_states:
      shape:
      - 2
    joint_states:
      shape:
      - 7
    robot0_agentview_left_rgb:
      shape:
      - 3
      - 224
      - 224
      type: rgb
    robot0_agentview_right_rgb:
      shape:
      - 3
      - 224
      - 224
      type: rgb
    robot0_eye_in_hand_rgb:
      shape:
      - 3
      - 224
      - 224
      type: rgb
    language:
      shape:
      - 768

shape_meta_env: &shape_meta_env
  image_resolution: 224
  action:
    shape:
    - 12
  obs:
    ee_pos:
      shape:
      - 3
    ee_ori:
      shape:
      - 3
    gripper_states:
      shape:
      - 2
    joint_states:
      shape:
      - 7
    robot0_agentview_left_rgb:
      shape:
      - 3
      - 224
      - 224
      type: rgb
    robot0_agentview_right_rgb:
      shape:
      - 3
      - 224
      - 224
      type: rgb
    robot0_eye_in_hand_rgb:
      shape:
      - 3
      - 224
      - 224
      type: rgb

dataset:
  _target_: unified_video_action.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
  shape_meta: *shape_meta
  language_emb_model: clip
  abs_action: false
  dataset_path: data/robocasa/demo.hdf5
  horizon: 32
  n_obs_steps: null
  pad_after: 7
  pad_before: 1
  rotation_rep: rotation_6d
  seed: 42
  use_cache: true
  recursive_hdf5: true
  val_ratio: 0.02
  data_aug: false
  normalizer_type: all

  
env_runner:
  _target_: unified_video_action.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: demo.hdf5
  use_robocasa_env: true
  controller_configs_path: robocasa_controller_configs.pkl
  env_name: null
  env_type: null
  env_meta: null
  shape_meta: *shape_meta_env
  # costs 1GB per env
  n_train: 0
  n_train_vis: 1
  train_start_idx: 0
  n_test: 20
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: 1000
  n_obs_steps: 16
  n_action_steps: 8
  render_obs_key: 'robot0_agentview_right_image'
  fps: 10
  crf: 22
  past_action: false
  #abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 2
  env_kwargs:
    robots: PandaMobile
    seed: 1111111
    obj_instance_split: 'test'
    layout_and_style_ids: null
    generative_textures: null
    randomize_cameras: false
    translucent_robot: false
    clutter_mode: 0

    use_camera_obs: true
    use_object_obs: true
    camera_depths: false
    has_renderer: false
    has_offscreen_renderer: true
    camera_names: ['robot0_agentview_left', 'robot0_agentview_right', 'robot0_eye_in_hand']
    camera_widths: 224
    camera_heights: 224
    control_freq: 20
    ignore_done: true
    reward_shaping: false
